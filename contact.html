<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact Us</title>
  <meta charset="UTF-8">
</head>

<body style="background-color:#edffeb;">

  <h2><font face="Times New Roman" size="4" color="#363020"><b>Contact Us</b></font></h2>

  <form>
    <fieldset>
      <legend><font face="Times New Roman" size="3" color="#363020">Get in Touch</font></legend>

      <label><font face="Times New Roman" size="3" color="#363020">Email:</font></label>
      <input type="email" name="email" placeholder="example@mail.com" required><br><br>

      <label><font face="Times New Roman" size="3" color="#363020">Phone:</font></label>
      <input type="tel" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required><br><br>

      <label><font face="Times New Roman" size="3" color="#363020">Message:</font></label><br>
      <textarea name="message" rows="5" cols="40" placeholder="Write your query here..." required></textarea><br><br>

      <input type="submit" value="Send">
    </fieldset>
  </form>

</body>
</html>
