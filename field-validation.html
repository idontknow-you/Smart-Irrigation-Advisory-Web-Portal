<!DOCTYPE html>
<html lang="en">
<head>
  <title>Field Validation</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="styling/style.css">
</head>

<body style="background-color:#ffffff;">
  <div class="top-fixed-header">
    <header class="header" background="white">
      <img id="logo" src="assets/full_logo.png" alt="Logo">
      <div class="header-text">
        <h1 color="#230f07" >Smart Irrigation Advisory System</h1>
        <p align="center"><i>Smart Irrigation using AI & Sensor Technology</i></p>
      </div>
    </header>
    <div class="divider"></div>
  </div>

  <div class="top-fixed-nav">
    <nav class="nav" >
        <a href="index.html" class="nav-btn">HOME</a>
        <a href="farm-info.html" class="nav-btn">FARM DASHBOARD</a>
        <a href="advisory.html" class="nav-btn">IRRIGATION ADVISORY</a>
        <a href="sensor-data.html" class="nav-btn">SENSOR DATA</a>
        <a href="contact.html" class="nav-btn">CONTACT</a>
    </nav>
    <div class="divider"></div>
  </div>

  <div class="page-wrap">
    <div class="page-content">
      <h2><font face="Times New Roman" size="4" color="#363020"><b>Field Validation</b></font></h2>
      <p><font face="Times New Roman" size="3" color="#363020">Click below to validate farmer name, mobile number and plot ID.</font></p>
      <button type="button" class="btn-submit" id="validateBtn">Validate Fields</button>
      <div id="output"></div>
    </div>
  </div>


  <script>
    function isValidName(name) {
      return /^[A-Za-z\s]+$/.test(name);
    }

    function isValidMobile(mobile) {
      return /^[0-9]{10}$/.test(mobile);
    }

    function isValidPlotId(plotId) {
      return /^AGR-[0-9]{4}$/.test(plotId);
    }

    document.getElementById("validateBtn").addEventListener("click", function () {
      var farmerName = prompt("Enter Farmer Name:");
      var mobileNumber = prompt("Enter Mobile Number:");
      var plotId = prompt("Enter Plot ID (format AGR-1234):");

      var nameResult = isValidName(farmerName) ? "Valid" : "Invalid - only alphabets and spaces allowed";
      var mobileResult = isValidMobile(mobileNumber) ? "Valid" : "Invalid - must be exactly 10 digits";
      var plotIdResult = isValidPlotId(plotId) ? "Valid" : "Invalid - must follow format AGR-1234";

      alert("Farmer Name: " + nameResult + "\nMobile Number: " + mobileResult + "\nPlot ID: " + plotIdResult);

      document.getElementById("output").innerHTML =
        "<p><font face='Times New Roman' size='3' color='#363020'>" +
        "<strong>Farmer Name (" + farmerName + "):</strong> " + nameResult + "<br>" +
        "<strong>Mobile Number (" + mobileNumber + "):</strong> " + mobileResult + "<br>" +
        "<strong>Plot ID (" + plotId + "):</strong> " + plotIdResult +
        "</font></p>";
    });
  </script>

</body>
</html>
