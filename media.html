<!DOCTYPE html>
<html lang="en">
<head>
  <title>Farm Media</title>
  <meta charset="UTF-8">
</head>

<body style="background-color:#edffeb;">

  <h2><font face="Times New Roman" size="4" color="#363020"><b>Farm Media Showcase</b></font></h2>

  <!-- Video Section -->
  <section>
    <h3><font face="Times New Roman" size="3" color="#363020"><b>Farm Irrigation Video</b></font></h3>
    <video width="400" height="300" controls>
      <source src="assets/irrigation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <!-- Audio Section -->
  <section>
    <h3><font face="Times New Roman" size="3" color="#363020"><b>Farm Advisory Audio</b></font></h3>
    <audio controls>
      <source src="assets/advisory.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </section>

  <!-- JavaScript Alert -->
  <section>
    <h3><font face="Times New Roman" size="3" color="#363020"><b>Interactive Alert</b></font></h3>
    <button onclick="alert('Reminder: Irrigate Plot A tomorrow morning for 2.5 hours!')">
      <font face="Times New Roman" size="3" color="#363020">Click for Advisory Alert</font>
    </button>
  </section>

</body>
</html>
