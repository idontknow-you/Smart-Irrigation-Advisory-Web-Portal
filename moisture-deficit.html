<!DOCTYPE html>
<html lang="en">
<head>
  <title>Moisture Deficit Calculator</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="styling/style.css">
</head>

<body style="background-color:#ffffff;">
  <div class="top-fixed-header">
    <header class="header" background="white">
      <img id="logo" src="assets/full_logo.png" alt="Logo">
      <div class="header-text">
        <h1 color="#230f07" >Smart Irrigation Advisory System</h1>
        <p align="center"><i>Smart Irrigation using AI & Sensor Technology</i></p>
      </div>
    </header>
    <div class="divider"></div>
  </div>

  <div class="top-fixed-nav">
    <nav class="nav" >
        <a href="index.html" class="nav-btn">HOME</a>
        <a href="farm-info.html" class="nav-btn">FARM DASHBOARD</a>
        <a href="advisory.html" class="nav-btn">IRRIGATION ADVISORY</a>
        <a href="sensor-data.html" class="nav-btn">SENSOR DATA</a>
        <a href="contact.html" class="nav-btn">CONTACT</a>
    </nav>
    <div class="divider"></div>
  </div>

  <div class="page-wrap">
    <div class="page-content">
      <h2><font face="Times New Roman" size="4" color="#363020"><b>Moisture Deficit Calculator</b></font></h2>
      <p><font face="Times New Roman" size="3" color="#363020">Click below to enter the current plot details and calculate how much soil moisture deficit needs to be irrigated.</font></p>
      <button type="button" class="btn-submit" id="calcBtn">Calculate Moisture Deficit</button>
      <div id="output"></div>
    </div>
  </div>


  <script>
    document.getElementById("calcBtn").addEventListener("click", function () {
      var farmerName = prompt("Enter Farmer Name:");
      var plotId = prompt("Enter Plot ID:");
      var currentMoisture = parseFloat(prompt("Enter Current Soil Moisture (%):"));
      var requiredMoisture = parseFloat(prompt("Enter Required Soil Moisture (%):"));
      var moistureDeficit = requiredMoisture - currentMoisture;
      var status;
      if (moistureDeficit > 0) {
        status = "Irrigation Needed - " + moistureDeficit.toFixed(1) + "% moisture deficit";
      } else {
        status = "Irrigation Not Needed - Soil moisture is sufficient";
      }
      alert("Plot " + plotId + " (" + farmerName + "): " + status);
      document.getElementById("output").innerHTML =
        "<p><font face='Times New Roman' size='3' color='#363020'>" +
        "<strong>Farmer Name:</strong> " + farmerName + "<br>" +
        "<strong>Plot ID:</strong> " + plotId + "<br>" +
        "<strong>Current Soil Moisture:</strong> " + currentMoisture + "%<br>" +
        "<strong>Required Soil Moisture:</strong> " + requiredMoisture + "%<br>" +
        "<strong>Moisture Deficit:</strong> " + moistureDeficit.toFixed(1) + "%<br>" +
        "<strong>Irrigation Status:</strong> " + status +
        "</font></p>";
    });
  </script>

</body>
</html>
