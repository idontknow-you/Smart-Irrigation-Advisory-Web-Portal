<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sensor Readings Analysis</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="styling/style.css">
</head>

<body style="background-color:#ffffff;">
  <div class="top-fixed-header">
    <header class="header" background="white">
      <img id="logo" src="assets/full_logo.png" alt="Logo">
      <div class="header-text">
        <h1 color="#230f07" >Smart Irrigation Advisory System</h1>
        <p align="center"><i>Smart Irrigation using AI & Sensor Technology</i></p>
      </div>
    </header>
    <div class="divider"></div>
  </div>

  <div class="top-fixed-nav">
    <nav class="nav" >
        <a href="index.html" class="nav-btn">HOME</a>
        <a href="farm-info.html" class="nav-btn">FARM DASHBOARD</a>
        <a href="advisory.html" class="nav-btn">IRRIGATION ADVISORY</a>
        <a href="sensor-data.html" class="nav-btn">SENSOR DATA</a>
        <a href="contact.html" class="nav-btn">CONTACT</a>
    </nav>
    <div class="divider"></div>
  </div>

  <div class="page-wrap">
    <div class="page-content">
      <h2><font face="Times New Roman" size="4" color="#363020"><b>Hourly Sensor Readings Analysis</b></font></h2>
      <div id="output"></div>
    </div>
  </div>


  <script>
    var criticalValue = 30;
    var hourlyReadings = [45, 38, 32, 28, 25, 22, 27, 33, 40, 47, 52, 49];

    var minMoisture = hourlyReadings[0];
    var maxMoisture = hourlyReadings[0];
    var total = 0;
    var belowCriticalCount = 0;

    for (var i = 0; i < hourlyReadings.length; i++) {
      var reading = hourlyReadings[i];
      if (reading < minMoisture) { minMoisture = reading; }
      if (reading > maxMoisture) { maxMoisture = reading; }
      total += reading;
      if (reading < criticalValue) { belowCriticalCount++; }
    }

    var averageMoisture = total / hourlyReadings.length;

    document.getElementById("output").innerHTML =
      "<p><font face='Times New Roman' size='3' color='#363020'>" +
      "<strong>All Sensor Readings:</strong> " + hourlyReadings.join("%, ") + "%<br>" +
      "<strong>Minimum Moisture:</strong> " + minMoisture + "%<br>" +
      "<strong>Maximum Moisture:</strong> " + maxMoisture + "%<br>" +
      "<strong>Average Moisture:</strong> " + averageMoisture.toFixed(2) + "%<br>" +
      "<strong>Readings Below Critical Value (" + criticalValue + "%):</strong> " + belowCriticalCount +
      "</font></p>";
  </script>

</body>
</html>
