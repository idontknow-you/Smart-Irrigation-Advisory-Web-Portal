<body style="background-color:#ffffff;">
  <div class="top-fixed-header">
    <header class="header" background="white">
      <img id="logo" src="assets/full_logo.png" alt="Logo">
      <div class="header-text">
        <h1 color="#230f07" >Smart Irrigation Advisory System</h1>
        <p align="center"><i>Smart Irrigation using AI & Sensor Technology</i></p>
      </div>
    </header>

  <div class="top-fixed-nav">

      <h2><font face="Times New Roman" size="4" color="#363020"><b>Sugarcane Farm Profile</b></font></h2>
      <div id="output"></div>
    </div>
  </div>


  <script>
    var sugarcaneFarm = {
      farmerName: "Ramesh Patil",
      plotId: "AGR-1042",
      cropStage: "Grand Growth",
      soilMoisture: 42,
      area: 3.5,
      pumpStatus: "OFF",
      displayFarmInfo: function () {
        document.getElementById("output").innerHTML =
          "<p><font face='Times New Roman' size='3' color='#363020'>" +
          "<strong>Farmer Name:</strong> " + this.farmerName + "<br>" +
          "<strong>Plot ID:</strong> " + this.plotId + "<br>" +
          "<strong>Crop Stage:</strong> " + this.cropStage + "<br>" +
          "<strong>Soil Moisture:</strong> " + this.soilMoisture + "%<br>" +
          "<strong>Area:</strong> " + this.area + " acres<br>" +
          "<strong>Pump Status:</strong> " + this.pumpStatus +
          "</font></p>";
      }
    };

    sugarcaneFarm.displayFarmInfo();
  </script>
